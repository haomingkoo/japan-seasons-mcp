name: Verify Festival Data

on:
  schedule:
    # Every Sunday 18:00 UTC (Monday 03:00 JST); the job only verifies on the first Monday JST.
    # Cron ORs day-of-month with day-of-week, so '0 18 1-7 * 0' also fired daily on the 1st-7th.
    - cron: '0 18 * * 0'
  workflow_dispatch: # allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Skip unless first Monday of the month (JST)
        id: gate
        if: github.event_name == 'schedule'
        run: |
          day=$(TZ=Asia/Tokyo date +%-d)
          if [ "$day" -le 7 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "Not the first Monday JST (day $day); skipping."; fi

      - uses: actions/checkout@v4
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'

      - name: Set up Node.js
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run festival verification
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        run: node scripts/verify-festivals.mjs

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Festival data issues found — ${new Date().toISOString().slice(0,10)}`;
            const body = `The monthly festival verification found problems.\n\nRun \`node scripts/verify-festivals.mjs\` locally to see the full report, or check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n\nCommon issues:\n- A URL returned 404 (festival website moved)\n- A biennial event year is wrong\n- Missing required fields\n\nFix in \`public/festivals.json\` and update the \`verified\` date.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['data-quality'],
            });
