name: Scrape Fruit Farm Spots

on:
  schedule:
    # Every Monday at 2am JST (Sunday 17:00 UTC)
    - cron: '0 17 * * 0'
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      # Navitime was dropped: its AWS WAF returns 403 to GitHub runners (and to any automated client).
      # scrape-jalan.py exits non-zero without writing if any search is incomplete or the count drops.
      - name: Scrape Jalan
        run: python3 scrape-jalan.py
        timeout-minutes: 20

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Reads each farm's opening period; only new farms and ones checked over 45 days ago.
      - name: Read farm picking seasons
        run: node scripts/scrape-farm-seasons.mjs
        timeout-minutes: 25

      - name: Check if data changed
        id: check
        run: |
          git diff --quiet public/fruit-farms.json public/fruit-farm-seasons.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated farm data
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/fruit-farms.json public/fruit-farm-seasons.json
          git commit -m "chore: update fruit farm spots (weekly scrape)"
          git push
